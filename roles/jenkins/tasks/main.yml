---
# -------------------------------------------------------
# Jenkins Role — CI/CD server install + configure
# -------------------------------------------------------
- name: Add Jenkins repo
  ansible.builtin.get_url:
    url: "{{ jenkins_repo_url }}"
    dest: /etc/yum.repos.d/jenkins.repo
    mode: '0644'

- name: Import Jenkins GPG key
  ansible.builtin.rpm_key:
    key: "{{ jenkins_gpg_key }}"
    state: present

- name: Install Jenkins
  ansible.builtin.dnf:
    name: "{{ jenkins_package }}"
    state: present

- name: Install Python3 and pip
  ansible.builtin.dnf:
    name: "{{ jenkins_python_packages }}"
    state: present

- name: Add jenkins user to docker group
  ansible.builtin.user:
    name: "{{ jenkins_user }}"
    groups: docker
    append: true
  notify: Restart Jenkins

# -------------------------------------------------------
# Custom temp directory — avoids permission issues with the default /tmp
# -------------------------------------------------------
- name: Create Jenkins temp directory
  ansible.builtin.file:
    path: "{{ jenkins_tmp_dir }}"
    state: directory
    owner: "{{ jenkins_user }}"
    group: "{{ jenkins_user }}"
    mode: '0755'

- name: Configure Jenkins JAVA_OPTS (custom tmp dir)
  ansible.builtin.lineinfile:
    path: "{{ jenkins_service_file }}"
    regexp: '^Environment="JAVA_OPTS='
    line: 'Environment="JAVA_OPTS={{ jenkins_java_opts }}"'
    backup: true
  notify:
    - Reload systemd
    - Restart Jenkins

- name: Ensure Jenkins is started and enabled
  ansible.builtin.service:
    name: "{{ jenkins_package }}"
    state: started
    enabled: true

# Run the config-change handlers (reload + restart) now so that
# Jenkins is up with the fresh config by the time we verify below
- name: Flush handlers
  ansible.builtin.meta: flush_handlers

# -------------------------------------------------------
# Verification — confirm the Jenkins service is up and the port is open
# -------------------------------------------------------
- name: Wait for Jenkins to listen on its port
  ansible.builtin.wait_for:
    port: "{{ jenkins_port }}"
    host: 127.0.0.1
    delay: 5
    timeout: 120

- name: Check Jenkins service is active
  ansible.builtin.command: systemctl is-active {{ jenkins_package }}
  register: jenkins_active_check
  changed_when: false
  failed_when: jenkins_active_check.stdout != "active"

- name: Assert Jenkins is running
  ansible.builtin.assert:
    that:
      - jenkins_active_check.stdout == "active"
    fail_msg: "Jenkins did not start — check the service logs"
    success_msg: "Jenkins running & listening on port {{ jenkins_port }}"

- name: Show Jenkins access URL
  ansible.builtin.debug:
    msg: "Jenkins ready at http://{{ ansible_host | default(inventory_hostname) }}:{{ jenkins_port }}"
